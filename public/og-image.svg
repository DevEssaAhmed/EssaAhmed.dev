    <circle cx="24" cy="20" r="4.5" fill="#10B981" />
    <text x="40" y="25" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#E2E8F0">essaahmed.dev</text>
  </g>

