  <rect width="1200" height="630" fill="url(#cobaltGlow)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />

  <!-- Subtle Structural Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

