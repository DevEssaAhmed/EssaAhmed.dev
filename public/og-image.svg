      <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#tileGlow)" />
      <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" />
      <path d="M12 17H27.5V22.2H17.2V29.4H25V34.6H17.2V41.8H27.5V47H12V17Z" fill="#F8FAFC" />
      <path d="M38.6 17H43.9L52 47H46.5L41.25 26.8L36 47H30.5L38.6 17Z" fill="url(#accentGrad)" />
      <rect x="38.25" y="39.4" width="6" height="4.4" rx="2.2" fill="#F8FAFC" />
    </g>
    <text x="98" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="-0.02em">Essa Ahmed</text>
    <text x="98" y="61" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#94A3B8" letter-spacing="0.04em">INDUSTRIAL &amp; SYSTEMS ENGINEER</text>
