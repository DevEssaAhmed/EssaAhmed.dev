    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 14) rotate(45) scale(48)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
