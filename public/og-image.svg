      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 530) rotate(215) scale(500 380)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <pattern id="hairlineGrid" width="48" height="48" patternUnits="userSpaceOnUse">
